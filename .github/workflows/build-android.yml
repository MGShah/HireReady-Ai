name: Build Nexa Android Release (.AAB & .APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Client & Sync Capacitor
        run: |
          npm run build:android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x client/android/gradlew

      - name: Build Android App Bundle (.aab)
        run: |
          cd client/android
          ./gradlew bundleRelease --stacktrace

      - name: Build Universal APK (.apk)
        run: |
          cd client/android
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Android App Bundle (.aab for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nexa-playstore-bundle-aab
          path: client/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Release APK (for Direct Testing)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexa-release-apk
          path: client/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
