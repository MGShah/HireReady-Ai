  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:system-ui,-apple-system,sans-serif;">
        <div style="text-align:center;">
          <div style="width:36px;height:36px;border:3px solid #6366f1;border-top-color:transparent;border-radius:50%;margin:0 auto 14px;animation:nexa-spin 0.8s linear infinite;"></div>
          <p style="font-size:14px;font-weight:600;color:#94a3b8;margin:0;letter-spacing:0.025em;">Starting hireReady-AI...</p>
        </div>
      </div>
      <style>@keyframes nexa-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // In local development, automatically unregister any stale Service Worker and clear cache to prevent blank screens
      const isDevHost = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if ("serviceWorker" in navigator) {
        if (isDevHost) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
              console.log("[hireReady-AI] Unregistered dev Service Worker:", registration.scope);
            }
          });
          if ("caches" in window) {
            caches.keys().then((keys) => {
              for (const key of keys) caches.delete(key);
            });
          }
        } else {
          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("/sw.js")
              .then((reg) => console.log("[hireReady-AI] PWA Service Worker registered:", reg.scope))
              .catch((err) => console.warn("[hireReady-AI] Service Worker registration note:", err));
          });
        }
      }
    </script>
  </body>
